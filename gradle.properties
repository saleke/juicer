# Project-wide Gradle settings.
# Memory-constrained host (3.7 GB RAM): keep Gradle + Kotlin daemon heaps small
# and single-worker to avoid OOM kills (exit 137) during compilation.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
